services:
  - type: web
    name: wifi-presence
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python database/init_db.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:////var/data/wifi_presence.db"
    disk:
      name: wifi-presence-db
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health

